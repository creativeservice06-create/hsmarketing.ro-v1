<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hard Service v18 — animație reală</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;font-family:Arial,sans-serif}.h{max-width:1100px;display:flex;gap:30px;margin:22px auto;padding:20px}.hero-copy{width:38%;padding-top:70px}.hero-copy h1{font-size:40px;line-height:1.18;color:#122a4a}.hero-copy p{font-size:17px;line-height:1.75;color:#607590}.hero-visual{width:62%;min-width:0}/* Hero v18 — independently animated SVG scene. Layout is fixed in the viewBox
   and scales as one piece on narrow devices; no overlaying HTML panels. */
.hs18-wrap{width:100%;max-width:720px;min-width:0;margin:0 auto;border-radius:22px;overflow:hidden;background:#f7fbff;box-shadow:0 16px 50px rgba(24,68,126,.08)}
.hs18-art{width:100%;height:auto;display:block;max-width:100%;aspect-ratio:720 / 790}
.hs18-art .hs18-phone-bob,.hs18-art .hs18-logo-logo1,.hs18-art .hs18-logo-logo2,.hs18-art .hs18-logo-logo3,.hs18-art .hs18-card-ad-float,.hs18-art .hs18-card-results-float,.hs18-art .hs18-chart-float {animation:hs18-float 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.hs18-art .hs18-phone-bob{animation-duration:8.5s;animation-delay:-.8s}
.hs18-art .hs18-logo-logo1{animation-delay:-1s}
.hs18-art .hs18-logo-logo2{animation-delay:-3s}
.hs18-art .hs18-logo-logo3{animation-delay:-5s}
.hs18-art .hs18-card-ad-float{animation-delay:-1.5s;animation-duration:8s}
.hs18-art .hs18-card-results-float{animation-delay:-4s;animation-duration:8s}
.hs18-art .hs18-chart-float{animation-delay:-3s;animation-duration:9s}
.hs18-art .hs18-bar{transform-box:fill-box;transform-origin:bottom;animation:hs18-bar-grow 2.3s ease-in-out infinite alternate}
.hs18-art .hs18-bar-a{animation-delay:-.8s}.hs18-art .hs18-bar-b{animation-delay:-.3s}.hs18-art .hs18-bar-c{animation-delay:-1s}.hs18-art .hs18-bar-d{animation-delay:-1.5s}
.hs18-art .hs18-chart-line{stroke-dasharray:500;stroke-dashoffset:500;animation:hs18-trace 2.2s cubic-bezier(.3,.05,.25,1) .3s forwards}
.hs18-art .hs18-chart-points{animation:hs18-points .7s ease 1.85s forwards}
@keyframes hs18-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes hs18-bar-grow{0%{transform:scaleY(.72)}100%{transform:scaleY(1)}}
@keyframes hs18-trace{0%{stroke-dashoffset:500}70%,100%{stroke-dashoffset:0}}
@keyframes hs18-points{0%{opacity:0}100%{opacity:1}}
@media(max-width:700px){.hs18-wrap{border-radius:16px;box-shadow:0 12px 35px rgba(24,68,126,.07)}}
@media(prefers-reduced-motion:reduce){.hs18-art .hs18-phone-bob,.hs18-art .hs18-logo-logo1,.hs18-art .hs18-logo-logo2,.hs18-art .hs18-logo-logo3,.hs18-art .hs18-card-ad-float,.hs18-art .hs18-card-results-float,.hs18-art .hs18-chart-float,.hs18-art .hs18-bar,.hs18-art .hs18-chart-points,.hs18-art .hs18-chart-line{animation:none!important}.hs18-art .hs18-chart-line{stroke-dashoffset:0}}

.hs18-art .hs18-chart-points{opacity:0}
@media(max-width:850px){.h{display:block;margin:0;padding:12px}.hero-copy{width:100%;padding:10px 10px 18px}.hero-copy h1{font-size:27px}.hero-copy p{font-size:15px}.hero-visual{width:100%}}</style></head><body><div class="h"><div class="hero-copy"><h1>Agenție Google Ads, Meta Ads și TikTok Ads pentru mai multe contacte și vânzări.</h1><p>Campanii, website și tracking într-un sistem de promovare mai clar.</p></div><div class="hero-visual"><div class="hs18-wrap">      <svg
